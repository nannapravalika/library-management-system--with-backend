<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Library Management System developed using HTML, CSS and JavaScript for managing books, members and library operations.">
<meta name="keywords" content="Library Management System, HTML, CSS, JavaScript, Responsive Website">
<meta name="Ramtejkumar" content="Name">
<link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon">

<title>Library Login</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="login-body">

<div class="login-container">

<div class="login-left">

<h1>Smart Library</h1>

<p>

Welcome back!

Manage books, members, and issue records from one place.

</p>

<img src="../assets/images/login-library.png" alt="Library">

</div>

<div class="login-right">

<form id="loginForm">

<h2>Administrator Login</h2>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="username"
placeholder="Username"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<div class="remember">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">

Login

</button>

<p id="loginMessage"></p>

</form>

</div>

</div>

<script src="../js/config.js"></script>
<script src="../js/login.js"></script>

</body>

</html>
