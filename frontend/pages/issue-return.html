<main class="main-content">

<h1>Issue & Return Books</h1>

<div class="crud-form">

<select id="bookSelect">

<option value="">Select Book</option>

</select>

<select id="memberSelect">

<option value="">Select Member</option>

</select>

<input
type="date"
id="issueDate">

<input
type="date"
id="returnDate">

<button onclick="issueBook()">

Issue Book

</button>

</div>

<div class="search-box">

<input
type="text"
id="searchIssue"
placeholder="Search..."
onkeyup="searchIssues()">

</div>

<table id="issueTable">

<thead>

<tr>

<th>Book</th>
<th>Member</th>
<th>Issue Date</th>
<th>Return Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>
